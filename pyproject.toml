[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "openrecognition"
version = "0.1.0"
description = "API-first multi-modal recognition service for homelab and Home Assistant"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "pydantic>=2.9.0",
  "pydantic-settings>=2.6.0",
  "python-multipart>=0.0.12",
  "numpy>=1.26.0",
  "onnxruntime>=1.19.0",
  "bcrypt>=4.2.0",
  "httpx>=0.27.0",
  "PyYAML>=6.0.2",
  "soundfile>=0.12.0",
  "kaldi-native-fbank>=1.18",
  "Pillow>=10.4.0",
  "paho-mqtt>=2.1.0",
  "aiofiles>=24.1.0",
  "wyoming>=1.10.2",
  "zeroconf>=0.132.0",
  "cryptography>=42",
  "signxml>=4.0",
  "mcp>=1.6.0",
]

[project.optional-dependencies]
# Kept for docs / explicit installs; same packages are in the base wheel.
wyoming = ["wyoming>=1.10.2", "zeroconf>=0.132.0"]
mcp = ["mcp>=1.6.0"]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
  "httpx>=0.27.0",
  "ruff>=0.7.0",
  "mcp>=1.6.0",
]

[project.scripts]
openrecognition = "openrecognition.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/openrecognition"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
src = ["src"]
