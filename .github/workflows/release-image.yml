# Builds docker/Dockerfile.edge when a GitHub release is published and pushes
# a multi-arch image to GHCR: ghcr.io/<owner>/<repo>.
#
# Tags (from a release tag such as 0.1.0 or v0.1.0):
#   0.1.0
#   0.1
#   latest          stable releases only; pre-releases stay on their version tag
#
# The workflow file must already be on the default branch. Release events do
# not run a workflow that exists only on the tagged commit.

name: Release image

on:
  release:
    types: [published]

concurrency:
  group: release-image-${{ github.event.release.tag_name }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write
  attestations: write
  id-token: write

env:
  REGISTRY: ghcr.io

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      attestations: write
      id-token: write
    steps:
      - name: Check out the release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0

      - name: Require a semver release tag
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          if ! printf '%s' "$RELEASE_TAG" | grep -Eq '^v?(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$'; then
            echo "Release tag '$RELEASE_TAG' is not a version. Use 0.1.0 or v0.1.0 (pre-releases like v0.2.0-rc.1 are fine)." >&2
            exit 1
          fi

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          context: git
          images: ${{ env.REGISTRY }}/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          flavor: |
            latest=auto

      - name: Confirm image tags
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          if [ -z "$IMAGE_TAGS" ]; then
            echo "The release tag did not produce any image tags." >&2
            exit 1
          fi
          printf '%s\n' "$IMAGE_TAGS"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build linux/amd64 for a smoke test
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile.edge
          platforms: linux/amd64
          load: true
          tags: openrecognition:smoke
          provenance: false
          sbom: false
          cache-from: type=gha,scope=release
          cache-to: type=gha,scope=release,mode=max

      - name: Smoke test
        run: |
          set -euo pipefail
          docker run -d --name or-smoke -p 8080:8080 openrecognition:smoke
          ok=0
          cleanup() {
            status=$?
            if [ "$ok" -ne 1 ]; then
              docker logs or-smoke >&2 || true
            fi
            docker rm -f or-smoke >/dev/null 2>&1 || true
            exit "$status"
          }
          trap cleanup EXIT
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/health/live; then
              echo
              ok=1
              exit 0
            fi
            sleep 2
          done
          echo "OpenRecognition did not answer /health/live" >&2
          exit 1

      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile.edge
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          provenance: true
          sbom: true
          cache-from: type=gha,scope=release
          cache-to: type=gha,scope=release,mode=max

      - name: Note the image on the release
        uses: actions/github-script@v8
        env:
          IMAGE_VERSION: ${{ steps.meta.outputs.version }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        with:
          script: |
            const owner = context.repo.owner.toLowerCase();
            const repo = context.repo.repo.toLowerCase();
            const image = `ghcr.io/${owner}/${repo}`;
            const version = process.env.IMAGE_VERSION;
            const digest = process.env.IMAGE_DIGEST;
            const marker = "<!-- openrecognition-image -->";
            const block = [
              marker,
              "## Container image",
              "",
              "```bash",
              `docker pull ${image}:${version}`,
              "```",
              "",
              `Digest: \`${digest}\``,
              "",
              "Platforms: `linux/amd64`, `linux/arm64`.",
            ].join("\n");
            const current = context.payload.release.body || "";
            const body = current.includes(marker)
              ? current.replace(new RegExp(`${marker}[\\s\\S]*`), block)
              : `${current.trim() ? `${current.trim()}\n\n` : ""}${block}\n`;
            await github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: context.payload.release.id,
              body,
            });
