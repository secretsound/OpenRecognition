# Builds docker/Dockerfile.edge when a GitHub release is published and pushes
# a multi-arch image to GHCR: ghcr.io/<owner>/<repo>.
#
# Tags (from a release tag such as 0.1.0 or v0.1.0):
#   0.1.0
#   0.1
#   latest          stable releases only; pre-releases stay on their version tag
#
# The workflow file must already be on the default branch. Release events do
# not run a workflow that exists only on the tagged commit.
#
# linux/amd64 and linux/arm64 build on native runners, then one manifest list
# is published. Each architecture has its own cache.

name: Release image

on:
  release:
    types: [published]

concurrency:
  group: release-image-${{ github.event.release.tag_name }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write
  attestations: write
  id-token: write

env:
  REGISTRY: ghcr.io
  CACHE_SCOPE: release

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - name: Require a semver release tag
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          if ! printf '%s' "$RELEASE_TAG" | grep -Eq '^v?(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$'; then
            echo "Release tag '$RELEASE_TAG' is not a version. Use 0.1.0 or v0.1.0 (pre-releases like v0.2.0-rc.1 are fine)." >&2
            exit 1
          fi

  build:
    needs: guard
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
            runner: ubuntu-latest
            smoke: true
          - platform: linux/arm64
            arch: arm64
            runner: ubuntu-24.04-arm
            smoke: false
    steps:
      - name: Check out the release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0

      - name: Image name
        run: echo "IMAGE=${REGISTRY}/$(printf '%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          context: git
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          flavor: |
            latest=auto
          labels: |
            org.opencontainers.image.title=OpenRecognition
            org.opencontainers.image.description=Self-hosted voice, face, and object recognition. Mount /data and /models. The console listens on port 8080.
            org.opencontainers.image.documentation=https://github.com/secretsound/OpenRecognition/blob/main/docker/README.md
            org.opencontainers.image.licenses=Apache-2.0

      - name: Confirm image tags
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          if [ -z "$IMAGE_TAGS" ]; then
            echo "The release tag did not produce any image tags." >&2
            exit 1
          fi
          printf '%s\n' "$IMAGE_TAGS"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build linux/amd64 for a smoke test
        if: matrix.smoke
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile.edge
          platforms: linux/amd64
          load: true
          tags: openrecognition:smoke
          provenance: false
          sbom: false
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ env.CACHE_SCOPE }}-${{ matrix.arch }}
          cache-to: type=local,dest=${{ runner.temp }}/build-cache,mode=max

      - name: Smoke test
        if: matrix.smoke
        run: |
          set -euo pipefail
          docker run -d --name or-smoke -p 8080:8080 openrecognition:smoke
          ok=0
          cleanup() {
            status=$?
            if [ "$ok" -ne 1 ]; then
              docker logs or-smoke >&2 || true
            fi
            docker rm -f or-smoke >/dev/null 2>&1 || true
            exit "$status"
          }
          trap cleanup EXIT
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/health/live; then
              echo
              ok=1
              exit 0
            fi
            sleep 2
          done
          echo "OpenRecognition did not answer /health/live" >&2
          exit 1

      - name: Push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile.edge
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          provenance: true
          sbom: true
          cache-from: ${{ matrix.smoke && format('type=local,src={0}/build-cache', runner.temp) || format('type=gha,scope={0}-{1}', env.CACHE_SCOPE, matrix.arch) }}
          cache-to: type=gha,scope=${{ env.CACHE_SCOPE }}-${{ matrix.arch }},mode=max

      - name: Export digest
        run: |
          mkdir -p "${RUNNER_TEMP}/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "${RUNNER_TEMP}/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          retention-days: 1
          if-no-files-found: error

  merge:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      attestations: write
      id-token: write
    steps:
      - name: Check out the release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0

      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Image name
        run: echo "IMAGE=${REGISTRY}/$(printf '%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          context: git
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          flavor: |
            latest=auto
          labels: |
            org.opencontainers.image.title=OpenRecognition
            org.opencontainers.image.description=Self-hosted voice, face, and object recognition. Mount /data and /models. The console listens on port 8080.
            org.opencontainers.image.documentation=https://github.com/secretsound/OpenRecognition/blob/main/docker/README.md
            org.opencontainers.image.licenses=Apache-2.0

      - name: Create and push the manifest
        id: manifest
        working-directory: /tmp/digests
        run: |
          set -euo pipefail
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '%s@sha256:%s ' "$IMAGE" *)
          version="${{ steps.meta.outputs.version }}"
          digest="$(docker buildx imagetools inspect "${IMAGE}:${version}" --format '{{json .Manifest}}' | jq -r '.digest // .Digest // empty')"
          if [ -z "$digest" ]; then
            echo "Could not read the manifest digest for ${IMAGE}:${version}" >&2
            docker buildx imagetools inspect "${IMAGE}:${version}" >&2
            exit 1
          fi
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
          echo "Published:"
          printf '%s\n' "$DOCKER_METADATA_OUTPUT_TAGS"
          echo "Digest: ${digest}"

      - name: Note the image on the release
        uses: actions/github-script@v8
        env:
          IMAGE_VERSION: ${{ steps.meta.outputs.version }}
          IMAGE_DIGEST: ${{ steps.manifest.outputs.digest }}
        with:
          script: |
            const owner = context.repo.owner.toLowerCase();
            const repo = context.repo.repo.toLowerCase();
            const image = `ghcr.io/${owner}/${repo}`;
            const version = process.env.IMAGE_VERSION;
            const digest = process.env.IMAGE_DIGEST;
            const marker = "<!-- openrecognition-image -->";
            const block = [
              marker,
              "## Container image",
              "",
              "```bash",
              `docker pull ${image}:${version}`,
              "```",
              "",
              `Digest: \`${digest}\``,
              "",
              "Platforms: `linux/amd64`, `linux/arm64`.",
            ].join("\n");
            const current = context.payload.release.body || "";
            const body = current.includes(marker)
              ? current.replace(new RegExp(`${marker}[\\s\\S]*`), block)
              : `${current.trim() ? `${current.trim()}\n\n` : ""}${block}\n`;
            await github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: context.payload.release.id,
              body,
            });
