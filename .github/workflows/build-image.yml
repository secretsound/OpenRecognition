# Manual image build. Does not move release tags (0.1.0, 0.1, latest).
#
# Actions → Build image → Run workflow. Pick the branch to build.
# Published tags:
#   dev
#   sha-<commit>
#   <tag>     only when the workflow input is set
#
# linux/amd64 and linux/arm64 build on native runners and are published
# together. Emulating arm64 on an x86 runner is what made this job take
# 11+ minutes. Each architecture keeps its own cache so an amd64 export
# cannot replace the arm64 layers.

name: Build image

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Extra image tag, such as nightly. Leave empty to publish dev and the commit sha.
        required: false
        type: string
      platforms:
        description: Platforms
        required: true
        type: choice
        default: linux/amd64,linux/arm64
        options:
          - linux/amd64,linux/arm64
          - linux/amd64

concurrency:
  group: build-image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write
  attestations: write
  id-token: write

env:
  REGISTRY: ghcr.io
  CACHE_SCOPE: manual

jobs:
  guard:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.platforms.outputs.matrix }}
    steps:
      - name: Check the extra tag
        env:
          EXTRA_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [ -z "$EXTRA_TAG" ]; then
            exit 0
          fi
          if [ "$EXTRA_TAG" = "latest" ] || [ "$EXTRA_TAG" = "dev" ]; then
            echo "The extra tag cannot be latest or dev. latest is published by a GitHub release, and dev is always published by this workflow." >&2
            exit 1
          fi
          if printf '%s' "$EXTRA_TAG" | grep -Eq '^v?(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$'; then
            echo "Version tags are published by the Release image workflow." >&2
            exit 1
          fi
          if ! printf '%s' "$EXTRA_TAG" | grep -Eq '^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$'; then
            echo "Tag '$EXTRA_TAG' is not a valid Docker tag." >&2
            exit 1
          fi

      # Job-level if cannot read matrix, so the selected platforms are a matrix
      # output. linux/arm64 is omitted entirely when the input is amd64 only.
      - name: Choose platforms
        id: platforms
        env:
          PLATFORMS: ${{ inputs.platforms }}
        run: |
          set -euo pipefail
          amd64='{"platform":"linux/amd64","arch":"amd64","runner":"ubuntu-latest","smoke":true}'
          arm64='{"platform":"linux/arm64","arch":"arm64","runner":"ubuntu-24.04-arm","smoke":false}'
          case "$PLATFORMS" in
            linux/amd64)
              include="[$amd64]"
              ;;
            linux/amd64,linux/arm64)
              include="[$amd64,$arm64]"
              ;;
            *)
              echo "Unexpected platforms: $PLATFORMS" >&2
              exit 1
              ;;
          esac
          echo "matrix={\"include\":${include}}" >> "$GITHUB_OUTPUT"

  build:
    needs: guard
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.guard.outputs.matrix) }}
    steps:
      - name: Check out the selected ref
        uses: actions/checkout@v7

      - name: Image name
        run: echo "IMAGE=${REGISTRY}/$(printf '%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=dev
            type=sha
            type=raw,value=${{ inputs.tag }},enable=${{ inputs.tag != '' }}
          flavor: |
            latest=false
          labels: |
            org.opencontainers.image.title=OpenRecognition
            org.opencontainers.image.description=Self-hosted voice, face, and object recognition. Mount /data and /models. The console listens on port 8080.
            org.opencontainers.image.documentation=https://github.com/secretsound/OpenRecognition/blob/main/docker/README.md
            org.opencontainers.image.licenses=Apache-2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build linux/amd64 for a smoke test
        if: matrix.smoke
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile.edge
          platforms: linux/amd64
          load: true
          tags: openrecognition:smoke
          provenance: false
          sbom: false
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ env.CACHE_SCOPE }}-${{ matrix.arch }}
          cache-to: type=local,dest=${{ runner.temp }}/build-cache,mode=max

      - name: Smoke test
        if: matrix.smoke
        run: |
          set -euo pipefail
          docker run -d --name or-smoke -p 8080:8080 openrecognition:smoke
          ok=0
          cleanup() {
            status=$?
            if [ "$ok" -ne 1 ]; then
              docker logs or-smoke >&2 || true
            fi
            docker rm -f or-smoke >/dev/null 2>&1 || true
            exit "$status"
          }
          trap cleanup EXIT
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/health/live; then
              echo
              ok=1
              exit 0
            fi
            sleep 2
          done
          echo "OpenRecognition did not answer /health/live" >&2
          exit 1

      - name: Push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile.edge
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          provenance: true
          sbom: true
          cache-from: ${{ matrix.smoke && format('type=local,src={0}/build-cache', runner.temp) || format('type=gha,scope={0}-{1}', env.CACHE_SCOPE, matrix.arch) }}
          cache-to: type=gha,scope=${{ env.CACHE_SCOPE }}-${{ matrix.arch }},mode=max

      - name: Export digest
        run: |
          mkdir -p "${RUNNER_TEMP}/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "${RUNNER_TEMP}/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          retention-days: 1
          if-no-files-found: error

  merge:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Image name
        run: echo "IMAGE=${REGISTRY}/$(printf '%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=dev
            type=sha
            type=raw,value=${{ inputs.tag }},enable=${{ inputs.tag != '' }}
          flavor: |
            latest=false
          labels: |
            org.opencontainers.image.title=OpenRecognition
            org.opencontainers.image.description=Self-hosted voice, face, and object recognition. Mount /data and /models. The console listens on port 8080.
            org.opencontainers.image.documentation=https://github.com/secretsound/OpenRecognition/blob/main/docker/README.md
            org.opencontainers.image.licenses=Apache-2.0

      - name: Create and push the manifest
        id: manifest
        working-directory: /tmp/digests
        run: |
          set -euo pipefail
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '%s@sha256:%s ' "$IMAGE" *)
          first_tag="$(printf '%s\n' "$DOCKER_METADATA_OUTPUT_TAGS" | head -n 1)"
          digest="$(docker buildx imagetools inspect "$first_tag" --format '{{json .Manifest}}' | jq -r '.digest // .Digest // empty')"
          if [ -z "$digest" ]; then
            echo "Could not read the manifest digest for $first_tag" >&2
            docker buildx imagetools inspect "$first_tag" >&2
            exit 1
          fi
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
          echo "Published:"
          printf '%s\n' "$DOCKER_METADATA_OUTPUT_TAGS"
          echo "Digest: ${digest}"
