# Manual image build. Does not move release tags (0.1.0, 0.1, latest).
#
# Actions → Build image → Run workflow. Pick the branch to build.
# Published tags:
#   dev
#   sha-<commit>
#   <tag>     only when the workflow input is set

name: Build image

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Extra image tag, such as nightly. Leave empty to publish dev and the commit sha.
        required: false
        type: string
      platforms:
        description: Platforms
        required: true
        type: choice
        default: linux/amd64,linux/arm64
        options:
          - linux/amd64,linux/arm64
          - linux/amd64

concurrency:
  group: build-image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write
  attestations: write
  id-token: write

env:
  REGISTRY: ghcr.io

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the selected ref
        uses: actions/checkout@v7

      - name: Check the extra tag
        env:
          EXTRA_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [ -z "$EXTRA_TAG" ]; then
            exit 0
          fi
          if [ "$EXTRA_TAG" = "latest" ] || [ "$EXTRA_TAG" = "dev" ]; then
            echo "The extra tag cannot be latest or dev. latest is published by a GitHub release, and dev is always published by this workflow." >&2
            exit 1
          fi
          if printf '%s' "$EXTRA_TAG" | grep -Eq '^v?(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$'; then
            echo "Version tags are published by the Release image workflow." >&2
            exit 1
          fi
          if ! printf '%s' "$EXTRA_TAG" | grep -Eq '^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$'; then
            echo "Tag '$EXTRA_TAG' is not a valid Docker tag." >&2
            exit 1
          fi

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}
          tags: |
            type=raw,value=dev
            type=sha
            type=raw,value=${{ inputs.tag }},enable=${{ inputs.tag != '' }}
          flavor: |
            latest=false
          labels: |
            org.opencontainers.image.title=OpenRecognition
            org.opencontainers.image.description=Self-hosted voice, face, and object recognition. Mount /data and /models. The console listens on port 8080.
            org.opencontainers.image.documentation=https://github.com/secretsound/OpenRecognition/blob/main/docker/README.md
            org.opencontainers.image.licenses=Apache-2.0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build linux/amd64 for a smoke test
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile.edge
          platforms: linux/amd64
          load: true
          tags: openrecognition:smoke
          provenance: false
          sbom: false
          cache-from: type=gha,scope=manual
          cache-to: type=gha,scope=manual,mode=max

      - name: Smoke test
        run: |
          set -euo pipefail
          docker run -d --name or-smoke -p 8080:8080 openrecognition:smoke
          ok=0
          cleanup() {
            status=$?
            if [ "$ok" -ne 1 ]; then
              docker logs or-smoke >&2 || true
            fi
            docker rm -f or-smoke >/dev/null 2>&1 || true
            exit "$status"
          }
          trap cleanup EXIT
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/health/live; then
              echo
              ok=1
              exit 0
            fi
            sleep 2
          done
          echo "OpenRecognition did not answer /health/live" >&2
          exit 1

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile.edge
          platforms: ${{ inputs.platforms }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          provenance: true
          sbom: true
          cache-from: type=gha,scope=manual
          cache-to: type=gha,scope=manual,mode=max

      - name: Show the published tags
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          echo "Published:"
          printf '%s\n' "$IMAGE_TAGS"
